[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadet-verification"
version = "0.1.0"
description = "Verification test suite for CADET-Core"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
	"mpmath",
	"scipy",
	"numpy",
	"GPy",
	"tensorflow",
	"scikit-learn",
	"matplotlib",
	"pytest",
	"pandas",
	"h5py",
	"joblib",
]

[project.optional-dependencies]
cadet = [
	"cadet-core>=6.0.0a3",
	"cadet-python>=1.3",
	"cadet-rdm>=1.1.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.coverage.run]
# Store repo-relative paths so codecov can map the report to the repo tree,
# independent of where the tests run (e.g. /tmp/cadet-verification in CI).
relative_files = true
# The verification tests run the model groups in joblib (loky) worker
# processes; without this patch their execution is invisible to coverage.
patch = ["subprocess"]
# loky terminates idle workers with SIGTERM; save their data instead of losing it.
sigterm = true